<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>국어 단어암기</title>
    <link rel="stylesheet" id="mainCss">
    <script>document.getElementById('mainCss').href = 'style.css?v=' + Date.now();</script>
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <!-- 메인 화면 -->
    <div id="menuScreen" class="screen active">
        <div class="container">
            <h1>📚 국어 단어암기</h1>

            <button class="btn btn-primary btn-large" id="addSetBtn">
                📷 사진으로 단어 추가
            </button>

            <div class="btn-row">
                <button class="btn btn-secondary btn-half" id="exportBtn">📤 내보내기</button>
                <button class="btn btn-secondary btn-half" id="importBtn">📥 가져오기</button>
                <input type="file" id="importInput" accept=".json,application/json,text/plain" style="display: none;">
            </div>

            <div id="setsList" class="sets-list">
                <!-- 세트 목록 동적 생성 -->
            </div>
        </div>
    </div>

    <!-- OCR 화면 -->
    <div id="ocrScreen" class="screen">
        <div class="container">
            <div class="header">
                <button class="btn-back" id="ocrBackBtn">← 뒤로</button>
                <h2>단어 세트 추가</h2>
                <div style="width: 60px;"></div>
            </div>

            <div class="upload-section">
                <input type="file" id="galleryInput" accept="image/*" style="display: none;">
                <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
                <button class="btn btn-primary" id="galleryBtn" style="margin-bottom:10px;">
                    🖼️ 갤러리에서 선택
                </button>
                <button class="btn btn-primary" id="cameraBtn">
                    📷 카메라로 촬영
                </button>
            </div>

            <div id="imagePreviewContainer" class="image-preview-container" style="display: none;"></div>

            <div id="customPromptArea" style="display: none; margin-top: 20px;">
                <textarea id="customPromptInput" class="form-control" rows="3" placeholder="추가 요청사항을 입력하세요 (예: '영어 단어만 추출해줘', '반의어 관계만 찾아줘' 등)"></textarea>
                <button class="btn btn-primary" id="startOcrBtn" style="margin-top: 10px; width: 100%;">
                    ✨ 텍스트 추출 시작
                </button>
            </div>

            <div id="ocrProgress" style="display: none; text-align: center; padding: 40px;">
                <div class="spinner"></div>
                <p id="progressText">단어를 추출하는 중...</p>
            </div>

            <div id="ocrResult" style="display: none;">
                <button class="btn btn-primary" onclick="saveAllSetsAndStudy()"
                    style="width: 100%; margin-bottom: 25px; padding: 18px; font-size: 18px; font-weight: bold; border-radius: 12px; box-shadow: 0 4px 12px rgba(124, 179, 66, 0.2);">
                    ✨ 전체 세트 추가하고 학습 시작
                </button>
                <h3>추출된 결과</h3>
                <p style="color: #666; font-size: 14px; margin-bottom: 20px;">추출된 세트를 확인하고 저장하세요.</p>
                <div id="setsContainer"></div>
            </div>
        </div>
    </div>

    <!-- 학습 화면 -->
    <div id="studyScreen" class="screen">
        <div class="study-header">
            <button class="btn-back" id="studyBackBtn">← 뒤로</button>
            <div class="study-progress">
                <button class="btn-nav" id="prevBtn">‹</button>
                <span id="studyProgressText">1/10</span>
                <button class="btn-nav" id="nextBtn">›</button>
            </div>
            <button class="btn-menu" id="menuBtn">☰</button>
        </div>

        <div class="known-counter">
            <span>✓ <span id="knownCount">0</span></span>
            <span class="divider">|</span>
            <span id="totalCount">10</span>
        </div>

        <div class="study-container">
            <div class="study-info">
                <div id="setName"></div>
                <div class="study-motto">강민 할 수 있다!!!</div>
            </div>

            <div class="card-wrapper">
                <div class="card" id="flashCard">
                    <div class="card-header">
                        <div></div>
                        <button class="btn-status learning" id="statusBtn">학습중</button>
                    </div>
                    <div class="card-word" id="cardWord"></div>
                    <div class="card-meaning-area">
                        <div class="card-meaning-text" id="cardMeaning"></div>
                        <div class="meaning-cover" id="meaningCover">
                            <div class="cover-handle" id="coverHandle">
                                <div class="handle-bar"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 세트 학습 완료 오버레이 -->
        <div id="completionOverlay" class="completion-overlay" style="display:none;">
            <div class="completion-card">
                <div class="completion-emoji">🎉</div>
                <div class="completion-message" id="completionMessage"></div>
                <button class="btn btn-primary btn-large" id="nextSetBtn">다음 세트 학습</button>
                <button class="btn btn-secondary btn-large" id="backToMenuBtn" style="margin-top:10px;">메인으로
                    돌아가기</button>
            </div>
        </div>

        <!-- 사이드 메뉴 -->
        <div id="sideMenu" class="side-menu">
            <div class="side-menu-header">
                <h3>단어 세트</h3>
                <button class="btn-close" id="closeMenuBtn">✕</button>
            </div>
            <div id="menuContent" class="side-menu-content"></div>
        </div>
        <div id="menuOverlay" class="menu-overlay"></div>
    </div>

    <script>var s = document.createElement('script'); s.src = 'app.js?v=' + Date.now(); document.body.appendChild(s);</script>
</body>

</html>
